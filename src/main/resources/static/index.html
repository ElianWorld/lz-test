<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>量化选股平台</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f7fb; }
        .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; font-size: 14px; }
        .ok { color: #1a7f37; font-weight: 600; }
        .no { color: #b42318; }
        small { color: #667085; }
    </style>
</head>
<body>
<div class="card">
    <h2>量化炒股模型（H5）</h2>
    <small>策略：15日均线 + 周线15均线 + 20日均线附近 + 周线MACD红柱 + CCI/RSI背离 + LSTM趋势 + RL仓位 + 风控</small>
</div>

<div class="card">
    <h3>实时推荐（每5秒自动刷新）</h3>
    <table>
        <thead><tr><th>股票</th><th>价格</th><th>得分</th><th>趋势预测</th><th>建议仓位</th><th>是否入选</th></tr></thead>
        <tbody id="reco-body"></tbody>
    </table>
</div>

<div class="card">
    <h3>回测结果（Top3）</h3>
    <table>
        <thead><tr><th>股票</th><th>交易次数</th><th>胜率</th><th>年化</th><th>最大回撤</th><th>Sharpe</th></tr></thead>
        <tbody id="backtest-body"></tbody>
    </table>
</div>

<script>
    async function loadRecommendations() {
        const res = await fetch('/api/recommendations');
        const data = await res.json();
        const body = document.getElementById('reco-body');
        body.innerHTML = data.map(item => `
          <tr>
            <td>${item.symbol}</td>
            <td>${item.currentPrice}</td>
            <td>${item.score}</td>
            <td>${item.trendPrediction}</td>
            <td>${item.riskPosition}</td>
            <td class="${item.passed ? 'ok' : 'no'}">${item.passed ? '推荐' : '观察'}</td>
          </tr>
        `).join('');
    }

    async function loadBacktest() {
        const res = await fetch('/api/backtest');
        const data = await res.json();
        const body = document.getElementById('backtest-body');
        body.innerHTML = data.map(item => `
          <tr>
            <td>${item.symbol}</td>
            <td>${item.trades}</td>
            <td>${(item.winRate * 100).toFixed(2)}%</td>
            <td>${(item.annualizedReturn * 100).toFixed(2)}%</td>
            <td>${(item.maxDrawdown * 100).toFixed(2)}%</td>
            <td>${item.sharpe}</td>
          </tr>
        `).join('');
    }

    async function refresh() {
        await Promise.all([loadRecommendations(), loadBacktest()]);
    }

    refresh();
    setInterval(refresh, 5000);
</script>
</body>
</html>
